<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jambo OAuth Callback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>Jambo</h1>
        <p class="tagline">FNLB Bot Lobby System</p>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:2rem; padding-bottom:2rem;">
    <article id="result" class="card" aria-live="polite">
      <h1>OAuth Callback</h1>
      <p id="message">Processing...</p>
      <pre id="raw" class="mono" style="display:none;"></pre>
      <p id="next" style="margin-top:1rem;"></p>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Jambo — FNLB App</p>
    </div>
  </footer>

  <script>
    // Set current year in footer
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      // Parse query parameters
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var messageEl = document.getElementById('message');
      var rawEl = document.getElementById('raw');
      var nextEl = document.getElementById('next');

      function showError(msg, raw) {
        messageEl.textContent = msg;
        rawEl.style.display = 'block';
        rawEl.textContent = raw || 'Full query: ' + window.location.search;
        nextEl.innerHTML = 'If you believe this is an error, check the redirect URI registered with FNLB and try again.';
        document.title = 'Auth Failed';
      }

      if (error) {
        // Show error details to reviewers
        showError('Authentication failed: ' + error);
      } else if (code) {
        // Store login state so user stays "connected"
        try {
          localStorage.setItem('fnlb_connected', 'true');
          localStorage.setItem('fnlb_code', code);
        } catch (e) {
          // If localStorage is unavailable, continue but warn in console
          console.warn('localStorage unavailable:', e);
        }

        // Show clear successful authentication inside existing layout
        messageEl.textContent = 'Authentication successful.';
        rawEl.style.display = 'block';
        rawEl.textContent = 'Authorization code: ' + code;
        nextEl.innerHTML = '<a class="btn btn-primary" href="/">Go to dashboard</a>';
        document.title = 'Auth Successful';
      } else {
        // No parameters found
        showError('No authorization response detected.', 'Full URL: ' + window.location.href);
      }
    })();
  </script>
</body>
</html>
