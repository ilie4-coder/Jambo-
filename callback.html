<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jambo OAuth Callback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container" style="padding-top:2rem; padding-bottom:2rem;">
    <article id="result" class="card" aria-live="polite">
      <h1>OAuth Callback</h1>
      <p id="message">Processing...</p>
      <pre id="raw" class="mono" style="display:none;"></pre>
      <p id="next" style="margin-top:1rem;"></p>
    </article>
  </main>

  <script>
    (function () {
      // Parse query parameters
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error');
      var messageEl = document.getElementById('message');
      var rawEl = document.getElementById('raw');
      var nextEl = document.getElementById('next');

      if (error) {
        // Show error details to reviewers
        messageEl.textContent = 'Authentication failed: ' + error;
        rawEl.style.display = 'block';
        rawEl.textContent = 'Full query: ' + window.location.search;
        nextEl.innerHTML = 'If you believe this is an error, check the redirect URI registered with FNLB and try again.';
        document.title = 'Auth Failed';
      } else if (code) {
        // Show clear successful authentication
        messageEl.innerHTML = 'Authentication successful.';
        rawEl.style.display = 'block';
        rawEl.textContent = 'Authorization code: ' + code;
        nextEl.innerHTML = 'You may now close this tab and continue using the app. For verification, the authorization code is shown above.';
        document.title = 'Auth Successful';
      } else {
        // No parameters found
        messageEl.textContent = 'No authorization response detected.';
        rawEl.style.display = 'block';
        rawEl.textContent = 'Full URL: ' + window.location.href;
        nextEl.innerHTML = 'Ensure the FNLB authorize URL uses redirect_uri=https%3A%2F%2Fjambofnlb.netlify.app%2Fcallback and try again.';
        document.title = 'Auth Result';
      }
    })();
  </script>
</body>
</html>
